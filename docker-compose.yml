services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - backend_data:/app/data
    environment:
      - PORT=3000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  backend_data: